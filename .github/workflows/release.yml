name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Build demo
        run: npm run build:demo

      - name: Create Release
        run: |
          # Use RELEASE_NOTES_<tag>.md when present, otherwise let GitHub generate notes
          NOTES_FILE="RELEASE_NOTES_${{ github.ref_name }}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create ${{ github.ref_name }} \
            --title "${GITHUB_REF_NAME#v}" \
            "${NOTES_ARGS[@]}" \
            --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        run: |
          cd dev/dist
          zip -r demo-${{ github.ref_name }}.zip .
          gh release upload ${{ github.ref_name }} demo-${{ github.ref_name }}.zip \
            --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
